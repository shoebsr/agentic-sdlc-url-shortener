name: agentic-sdlc

x-shortener-env: &shortener-env
  ConnectionStrings__Shortener: "Server=sqlserver;Database=UrlShortener;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env};TrustServerCertificate=True;Encrypt=True"
  ConnectionStrings__Redis: "redis:6379"
  Database__Provider: SqlServer
  Shortener__PublicBaseUrl: "http://localhost:8080"
  Analytics__FingerprintKey: "${ANALYTICS_FINGERPRINT_KEY:?ANALYTICS_FINGERPRINT_KEY must be set in .env}"
  Http__TrustForwardedHeaders: "true"

x-healthcheck: &http-healthcheck
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 15s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  links-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: UrlShortener/UrlShortener.Api
        ENTRYPOINT_DLL: UrlShortener.Api.dll
    environment:
      <<: *shortener-env
      Database__InitializeOnStartup: "true"
      Hosting__ServeRedirects: "false"
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]

  redirect:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: UrlShortener/UrlShortener.Redirect
        ENTRYPOINT_DLL: UrlShortener.Redirect.dll
    environment:
      <<: *shortener-env
    deploy:
      replicas: 2
    depends_on:
      links-api: { condition: service_healthy }
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]

  analytics-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: UrlShortener/UrlShortener.AnalyticsWorker
        ENTRYPOINT_DLL: UrlShortener.AnalyticsWorker.dll
    environment:
      <<: *shortener-env
      DOTNET_ENVIRONMENT: Production
    deploy:
      replicas: 2
    depends_on:
      links-api: { condition: service_healthy }

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: Gateway/Gateway
        ENTRYPOINT_DLL: Gateway.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8080:8080"
    depends_on:
      links-api: { condition: service_healthy }
      redirect: { condition: service_healthy }
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/gateway/health"]

volumes:
  sqlserver-data:
  redis-data:
