name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AgenticSdlc.sln

      - name: Build
        run: dotnet build AgenticSdlc.sln --no-restore -c Release

      - name: Test
        run: dotnet test AgenticSdlc.sln --no-build -c Release --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml build
